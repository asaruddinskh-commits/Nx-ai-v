name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Detected Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Confirmed: Active Java major version ($JAVA_MAJOR) is 17 or newer."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="${KEYSTORE_DIR}/signing.keystore"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Using persistent keystore decoded from GitHub Actions Secret (SIGNING_KEYSTORE_BASE64)."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            STORE_PASSWORD="${STORE_PASS:-android}"
            KEY_ALIAS="${KEY_ALIAS_SECRET:-androiddebugkey}"
            KEY_PASSWORD="${KEY_PASS:-android}"
          else
            echo "⚠️ Notice: 'SIGNING_KEYSTORE_BASE64' secret not found."
            echo "Using temporary debug keystore generation for CI build."
            echo "To preserve the EXACT same certificate across every build and prevent 'Signature verified failed' on updates,"
            echo "please add SIGNING_KEYSTORE_BASE64 to repository Secrets."
            
            if [ -f "./debug.keystore" ]; then
              cp "./debug.keystore" "$KEYSTORE_FILE"
            else
              keytool -genkey -v \
                -keystore "$KEYSTORE_FILE" \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            STORE_PASSWORD="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASSWORD="android"
          fi
          
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file could not be prepared at $KEYSTORE_FILE"
            exit 1
          fi
          
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "Keystore successfully configured."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Signed APK with Android apksigner and aapt2
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac
          
          echo "=== 1. Locating Android SDK build-tools ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Found apksigner: $APKSIGNER"
          
          echo "=== 2. Verifying APK ZIP Alignment and Archive Integrity ==="
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v 4 "$EXPECTED_APK" > /dev/null || {
              echo "ERROR: zipalign integrity verification failed!"
              exit 1
            }
            echo "✅ ZIP alignment and archive integrity verified."
          fi
          
          echo "=== 3. Inspecting Package Name, Version Code and SDK Levels ==="
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$EXPECTED_APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          fi
          
          echo "=== 4. Official apksigner Signature Verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$EXPECTED_APK" > apksigner_output.txt
          cat apksigner_output.txt
          
          if ! grep -q "Verifies" apksigner_output.txt; then
            echo "ERROR: Official apksigner verification failed for $EXPECTED_APK"
            exit 1
          fi
          
          echo "✅ Official Android apksigner verification succeeded!"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release_assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          
          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          REPO_SANITIZED=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$REPO_SANITIZED" ]; then
            REPO_SANITIZED="android-app"
          fi
          
          ASSET_FILENAME="${REPO_SANITIZED}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_FULLPATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_FULLPATH"
          
          if [ ! -f "$ASSET_FULLPATH" ] || [ ! -s "$ASSET_FULLPATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $ASSET_FULLPATH"
            exit 1
          fi
          
          echo "asset_path=${ASSET_FULLPATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset: $ASSET_FULLPATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI availability..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH does not exist or is empty. Aborting release creation."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          {
            echo "### Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- **Build Type:** Automatically generated debug APK"
            echo "- **Builder:** GitHub Actions"
            echo "- **Run Number:** ${GITHUB_RUN_NUMBER}"
            echo "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            echo "- **Source Commit:** ${GITHUB_SHA}"
            echo "- **Signature Verification:** Passed official \`apksigner\` check (V1 + V2 Scheme)"
            echo "- **Package Name:** \`com.aistudio.arushiai.kqzvmp\`"
            echo "- **Version Code:** \`${GITHUB_RUN_NUMBER}\`"
            echo "- **Testing Notice:** This APK is intended for testing. It is not a Play Store production release."
          } > "$NOTES_FILE"
          
          echo "Publishing release with tag: $RELEASE_TAG and asset: $ASSET_PATH"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always() && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Successfully Published ==="
            gh release view "$RELEASE_TAG"
            
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "### ✅ Debug APK Release Published Successfully"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Download APK:** [${ASSET_NAME}](${RELEASE_URL}) directly under the release **Assets** section."
              echo "- **Backup Artifact:** The standard Actions artifact \`app-debug-apk\` is also preserved and available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed, but the APK build was successful."
            echo "The debug APK artifact 'app-debug-apk' was uploaded and remains available in this run's artifacts."
            
            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)"
              echo "- **Status:** The debug APK was built and verified successfully."
              echo "- **Actions Artifact:** Download the verified APK from the Actions summary artifact named **\`app-debug-apk\`**."
              echo "- **Release Notice:** Release publishing encountered an error or lacked repository release permission, but the built APK artifact was safely preserved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
